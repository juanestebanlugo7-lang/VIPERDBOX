<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/x-icon" href="/lentes.ico">
  <meta charset="UTF-8">
  <title>Registro - Viperdbox</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="navbar">
    <div class="logo"><a href="/login.html">VIPERDBOX</a></div>
  </div>
  <div class="auth-container">
    <h2>Registro de Usuario</h2>
    <input type="text" id="name" placeholder="Nombre completo">
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">
    <input type="password" id="confirm" placeholder="Confirmar contraseña">
    <button onclick="const pwd = document.getElementById('password').value; if(pwd !== document.getElementById('confirm').value) alert('Las contraseñas no coinciden'); else register(document.getElementById('name').value, document.getElementById('email').value, pwd)">Registrarse</button>
    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
    </div>
  </div>
  <script src="/js/main.js"></script>
</body>
</html>
