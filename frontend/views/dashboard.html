<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/lentes.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Viperdbox</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="navbar">
        <div class="logo"><a href="/catalog.html">VIPERDBOX</a></div>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/catalog.html">Películas</a>
            <a href="/profile.html">Mi Perfil</a>
            <a id="logoutBtn" style="cursor: pointer;">Cerrar sesión</a>
        </div>
    </div>

    <div class="container">
        <h1> Dashboard de estadísticas</h1>

        <!-- Tarjetas de resumen -->
        <div class="dashboard-stats">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Usuarios registrados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalReviews">0</div>
                <div class="stat-label">Reseñas escritas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgRating">0</div>
                <div class="stat-label">Calificación promedio</div>
            </div>
        </div>

        <!-- Películas más comentadas -->
        <div class="dashboard-section">
            <h2> Películas más comentadas</h2>
            <div id="topMovies" class="top-movies-list">
                <p>Cargando...</p>
            </div>
        </div>

        <!-- Actividad reciente -->
        <div class="dashboard-section">
            <h2> Actividad reciente</h2>
            <div id="recentActivity" class="activity-list">
                <p>Cargando...</p>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        loadDashboard();
    </script>
</body>
</html>
