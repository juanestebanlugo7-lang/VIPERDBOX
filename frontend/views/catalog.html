<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo - Viperdbox</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="navbar">
    <div class="logo">VIPERDBOX</div>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/catalog.html">Películas</a>
      <a href="/profile.html">Mi Perfil</a>
      <a id="logoutBtn" style="cursor: pointer;">Cerrar sesión</a>
    </div>
  </div>

  <div class="container">
    <h1>Catálogo de películas</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar películas...">
      <button id="searchBtn">Buscar</button>
      <button id="clearBtn">Limpiar</button>
    </div>
    <!-- Filtros (opcionales, si quieres mantener la UI) -->
    <div class="filters">
      <label>Género: <select><option>Todos</option></select></label>
      <label>Año: <select><option>Todos</option></select></label>
    </div>
    <div id="moviesGrid" class="movies-grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
