<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil - Viperdbox</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="navbar">
    <div class="logo">VIPERDBOX</div>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/catalog.html">Películas</a>
      <a href="/profile.html">Mi Perfil</a>
      <a id="logoutBtn">Cerrar sesión</a>
    </div>
  </div>

  <div class="container">
    <div class="profile-card" id="profileInfo">
      <h2 id="profileName">Cargando...</h2>
      <p id="profileEmail"></p>
      <p>Miembro desde: <span id="profileSince"></span></p>
    </div>


    <h2>Mis listas</h2>
    <div class="stats" id="listsStats">
      <div class="stat-box">Favoritas: <span id="favCount">0</span></div>
      <div class="stat-box">Pendientes: <span id="pendCount">0</span></div>
      <div class="stat-box">Vistas: <span id="viewCount">0</span></div>
    </div>
  </div>

<script src="/js/main.js"></script>
<script>loadMyProfile();</script>
</body>
</html>
